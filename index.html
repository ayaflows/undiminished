<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undiminished</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: host dashboard beside guest phones. Demo mode shows all four at once on wide screens, tabs on narrow ones. Committed night-room look. */
:root {
  --bg: #120a1f;
  --panel: #180f27;
  --surface: #221535;
  --surface-2: #2b1c42;
  --line: rgba(214, 190, 255, 0.16);
  --line-strong: rgba(214, 190, 255, 0.32);
  --fg: #f4ecff;
  --muted: #b9a7d8;
  --dim: #8f7bb2;
  --accent: #c99bff;
  --accent-ink: #1a0d2c;
  --warm: #ffb98a;
  --alert: #ff9b9b;
  --alert-bg: rgba(255, 120, 120, 0.12);
  --ok: #92e6bb;
  --display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; }

.btn { background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 999px; padding: 12px 20px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line-strong); font-weight: 500; }
.btn.quiet { background: var(--surface-2); color: var(--fg); font-weight: 500; }
.btn.sm { padding: 6px 14px; min-height: 36px; font-size: 14px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: default; }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; padding: 6px 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-strong); border-radius: 999px; padding: 9px 14px; font-size: 15px; min-height: 40px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
input[type=text], input[type=email], textarea, select { width: 100%; font: inherit; color: var(--fg); background: rgba(255,255,255,.05); border: 1px solid var(--line-strong); border-radius: 12px; padding: 11px 13px; }
textarea { resize: none; }
select { appearance: none; }
.label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.small { font-size: 14px; }
.serif { font-family: var(--display); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.pill { font-size: 12px; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: rgba(146,230,187,.4); }
.pill.warm { color: var(--warm); border-color: rgba(255,185,138,.45); }
.pill.alert { color: var(--alert); border-color: rgba(255,155,155,.5); }
.orb { width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ecd9ff, var(--accent) 45%, #5b2aa0); animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.07); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Landing */
.landing { max-width: 560px; margin: 0 auto; padding-block: 48px 40px; display: flex; flex-direction: column; gap: 22px; }
.landing h1 { font-family: var(--display); font-size: 52px; line-height: 1; }
.landing .lede { color: var(--muted); font-size: 17px; max-width: 46ch; }
.choice { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.choice h2 { font-family: var(--display); font-size: 26px; }

/* Demo layout */
.demo-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.demo-bar h1 { font-family: var(--display); font-size: 28px; }
.demo-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
.demo-tabs button { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; color: var(--muted); white-space: nowrap; font-size: 14px; }
.demo-tabs button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); border-color: var(--line-strong); }
.demo-grid { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
.pane.is-off { display: none; }
.phone-wrap { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.phone-label { font-size: 13px; color: var(--dim); }
.phone { width: 100%; max-width: 380px; height: min(700px, calc(100vh - 150px)); min-height: 520px; border: 1px solid var(--line-strong); border-radius: 32px; overflow: hidden; background: var(--bg); box-shadow: 0 0 0 6px #0b0614; }
@media (min-width: 1360px) {
  .demo-tabs { display: none; }
  .demo-grid { grid-template-columns: minmax(420px, 1fr) repeat(3, minmax(250px, 290px)); }
  .pane.is-off { display: block; }
  .pane.host-pane { max-height: calc(100vh - 110px); overflow: auto; border: 1px solid var(--line); border-radius: 20px; }
  .phone { height: calc(100vh - 150px); min-height: 560px; }
}

/* Guest app */
.g { height: 100%; display: flex; flex-direction: column; background: var(--bg); position: relative; }
.g-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.g-stage { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.sos-btn { font-size: 13px; color: var(--alert); border: 1px solid rgba(255,155,155,.45); border-radius: 999px; padding: 6px 12px; min-height: 34px; }
.g-net { font-size: 13px; color: var(--warm); padding: 8px 16px; background: rgba(255,185,138,.08); }
.g-body { flex: 1; overflow: auto; padding: 20px 16px 28px; }
.g-body h2 { font-family: var(--display); font-size: 30px; line-height: 1.1; }
.prompt { font-family: var(--display); font-style: italic; font-size: 25px; line-height: 1.25; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.rest { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 16px; text-align: left; }
.rest p { color: var(--muted); font-size: 17px; max-width: 32ch; }
.steps { display: flex; gap: 4px; }
.steps span { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
.steps span.on { background: var(--accent); }
.timer { font-size: 40px; font-family: var(--display); font-variant-numeric: tabular-nums; line-height: 1; }
.bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }
.cold { background: linear-gradient(180deg, #1b1340, #0f0820); border-radius: 18px; padding: 28px 18px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.brag-card { background: linear-gradient(160deg, #2c1850, #1a0f2d); border: 1px solid rgba(201,155,255,.35); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.brag-card q { font-family: var(--display); font-style: italic; font-size: 22px; line-height: 1.3; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: none; }
.switch { width: 50px; height: 30px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-strong); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--dim); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] { background: rgba(201,155,255,.35); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--accent); }
.strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.strip i { aspect-ratio: 3 / 4; border-radius: 8px; background: linear-gradient(160deg, #3b2462, #1d1233); display: grid; place-items: center; font-style: normal; font-family: var(--display); font-size: 14px; color: var(--muted); max-width: 100%; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line-strong); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -20px 40px rgba(0,0,0,.4); z-index: 3; }
.applause { width: 100%; padding: 18px; border-radius: 18px; background: rgba(255,185,138,.14); border: 1px solid rgba(255,185,138,.45); color: var(--warm); font-weight: 600; font-size: 17px; }
.guest-page { height: 100%; max-width: 520px; margin: 0 auto; }

/* Host dashboard */
.h { background: var(--panel); display: flex; flex-direction: column; min-height: 100%; }
.host-page { max-width: 980px; margin: 0 auto; }
.h-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 18px 10px; flex-wrap: wrap; }
.h-title { font-family: var(--display); font-size: 32px; line-height: 1.05; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.code { font-family: var(--body); letter-spacing: .14em; color: var(--fg); }
.h-net { margin: 0 18px 8px; font-size: 13px; color: var(--warm); }
.alerts { display: flex; flex-direction: column; gap: 8px; padding: 0 18px; }
.alert { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 14px; background: var(--alert-bg); border: 1px solid rgba(255,155,155,.5); color: var(--fg); }
.alert b { color: var(--alert); }
.h-stage { margin: 10px 18px 0; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.h-stage .now { flex: 1; min-width: 160px; }
.h-stage .now b { font-family: var(--display); font-size: 22px; font-weight: 400; display: block; line-height: 1.1; }
.h-tabs { display: flex; gap: 4px; padding: 14px 18px 0; border-bottom: 1px solid var(--line); }
.h-tabs button { padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; }
.h-tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.h-body { padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 14px; }
.h-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.h-card h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.room-code { font-size: 44px; letter-spacing: .16em; font-weight: 600; line-height: 1; }
.qr { width: 156px; height: 156px; background: #fff; border-radius: 10px; padding: 4px; display: grid; place-items: center; flex: none; }
.qr img, .qr canvas { width: 148px !important; height: 148px !important; }
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: none; }
.li .who { font-weight: 600; min-width: 80px; }
.li .grow { flex: 1; min-width: 140px; color: var(--muted); font-size: 14px; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.group { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.member { border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; text-align: left; font-size: 14px; }
.member[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ros { display: flex; flex-direction: column; gap: 4px; }
.ros button { display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 10px; font-size: 14px; }
.ros button[aria-current="step"] { background: var(--surface-2); outline: 1px solid var(--accent); }
.ros .num { width: 22px; color: var(--dim); font-variant-numeric: tabular-nums; }
.ros .nm { flex: 1; }
.tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border-radius: 6px; padding: 1px 6px; }
.tag.app { color: var(--accent); border: 1px solid rgba(201,155,255,.5); }
.tag.room { color: var(--dim); border: 1px solid var(--line-strong); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.tile b { font-family: var(--display); font-size: 34px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 13px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--dim); font-weight: 500; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.yes { color: var(--ok); }
.no { color: var(--dim); }
.display { position: fixed; inset: 0; z-index: 20; background: #0b0614; display: flex; flex-direction: column; padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); gap: 20px; }
.display.inline { position: static; border-radius: 18px; border: 1px solid rgba(201,155,255,.35); padding: 18px; min-height: 360px; }
.display .big { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; max-width: 900px; margin: 0 auto; }
.display .big h2 { font-family: var(--display); font-size: clamp(36px, 6vw, 72px); line-height: 1.05; }
.display .big q { font-family: var(--display); font-style: italic; font-size: clamp(24px, 3.4vw, 40px); line-height: 1.3; }
.display .claps { font-size: 18px; color: var(--warm); font-variant-numeric: tabular-nums; }
.display.inline .big h2 { font-size: 38px; }
.display.inline .big q { font-size: 24px; }
.copybox { width: 100%; min-height: 160px; font-size: 13px; }
</style>
</head>
